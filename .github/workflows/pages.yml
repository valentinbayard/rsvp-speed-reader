name: Web app (GitHub Pages)

# Run it by hand (Actions → "Web app (GitHub Pages)" → Run workflow) after
# enabling Pages with source "GitHub Actions" in the repository settings. To
# deploy on every push, add a `push: { branches: [main], paths: ['web/**'] }` trigger.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
