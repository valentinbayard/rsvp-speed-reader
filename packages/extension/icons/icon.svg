<svg width="128" height="128" viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle -->
  <circle cx="64" cy="64" r="60" fill="#0f0f23"/>
  <circle cx="64" cy="64" r="60" stroke="#e94560" stroke-width="4"/>

  <!-- Focal line (vertical) -->
  <rect x="62" y="40" width="4" height="48" fill="#e94560"/>

  <!-- Letter "R" with ORP highlighted -->
  <text x="64" y="80" font-family="Arial, sans-serif" font-size="48" font-weight="bold" fill="#888" text-anchor="middle">
    <tspan fill="#e94560">R</tspan>
  </text>

  <!-- Speed indicator lines -->
  <g opacity="0.6">
    <line x1="20" y1="64" x2="35" y2="64" stroke="#e94560" stroke-width="2"/>
    <line x1="93" y1="64" x2="108" y2="64" stroke="#e94560" stroke-width="2"/>
  </g>
</svg>
